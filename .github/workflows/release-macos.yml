name: Release macOS

# Tag-triggered macOS release: push a `vX.Y.Z` tag (or `vX.Y.Z-beta.N` for a prerelease) and this
# builds a universal (Apple Silicon + Intel) .dmg and attaches it to a GitHub Release matching the
# tag -- shared with release-windows.yml and release-linux.yml, which build the same tag in
# parallel and attach their own installers to that same release.
#
# Signing status: signed with a real Apple-issued "Developer ID Application: ILYASS ANIDA
# (87G5QNR3X3)" certificate (Apple Developer Program membership went active 2026-08-25) --
# APPLE_CERTIFICATE/APPLE_CERTIFICATE_PASSWORD hold this real certificate now, superseding the
# earlier self-signed "MiXolume Release" placeholder used while enrollment was pending. Also
# notarized, via an App Store Connect API key (APPLE_API_KEY_ID/APPLE_API_ISSUER/APPLE_API_KEY_P8)
# -- tauri-action/tauri-cli submits the build to Apple's notary service and staples the ticket
# automatically as part of `tauri build` once APPLE_API_KEY/APPLE_API_ISSUER/APPLE_API_KEY_PATH
# are set, no separate manual `notarytool` step needed. Together, signing + notarization mean
# Gatekeeper should no longer show the "unidentified developer" warning at all.
#
# Separately, TAURI_SIGNING_PRIVATE_KEY/_PASSWORD sign the tauri-plugin-updater artifact
# (MiXolume_universal.app.tar.gz.sig) -- an unrelated Ed25519 keypair used only to prove to a
# user's already-installed app that an update actually came from us, nothing to do with macOS
# code signing/Gatekeeper at all. See generate-update-manifest's own comments for how the three
# release-*.yml workflows turn that into a single latest.json.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Import macOS signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: ILYASS ANIDA (87G5QNR3X3)"
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          # Separate from the certificate above: signs the updater artifact
          # (MiXolume_universal.app.tar.gz.sig) so tauri-plugin-updater can verify it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MiXolume ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what's new.

            **macOS:** signed and notarized by Apple -- just open it like any other app.
            Requires macOS 14.4+.

            **Windows:** unsigned -- SmartScreen may warn on first run. Click **More info → Run
            anyway**.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target universal-apple-darwin

      - name: Update the auto-update manifest
        uses: ./.github/actions/generate-update-manifest
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
