name: Release macOS DMG

# Manually-triggered build of a macOS .dmg, uploaded to a (draft) GitHub Release so it can be
# downloaded and installed without compiling anything locally. Kept separate from ci.yml (which
# only runs cargo check/test + frontend checks on every PR) since this does a full release build
# and is comparatively slow and heavyweight.
#
# NOTE: as of this workflow's creation, the macOS backend (src-tauri/src/mixer/macos.rs) had never
# been compiled -- this workflow run may be the first real compile of that code. See
# src-tauri/macos-audio/README.md for the known unverified spots if this build fails.
#
# The resulting .dmg is NOT code-signed or notarized (no Apple Developer account configured in
# this repo) -- macOS Gatekeeper will refuse to open it normally. Right-click the app -> Open (or
# `xattr -d com.apple.quarantine Mixolume.app`) to bypass this for a locally-downloaded build.
on:
  workflow_dispatch:

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable (universal binary targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: macos-preview
          releaseName: "Mixolume macOS preview build"
          releaseBody: |
            Unsigned macOS preview build (universal: Apple Silicon + Intel).

            Gatekeeper will block this on first launch since it isn't code-signed or notarized --
            right-click Mixolume.app and choose "Open", or run:
            `xattr -d com.apple.quarantine /path/to/Mixolume.app`

            **If you're updating from a previous build, delete the old Mixolume.app from
            /Applications (and unmount any other mounted copies of this DMG) before installing
            this one.** Confirmed live on real hardware: leaving an old copy around while
            installing a new one -- even with the same bundle identifier -- makes macOS's
            permission tracking for this unsigned/ad-hoc-signed app unreliable, causing repeated
            permission prompts and/or a blank black window that a single clean install doesn't
            have. This is a real limitation of shipping without a paid Apple Developer ID
            (proper code signing + notarization would eliminate it); until that's set up, always
            fully replace the old copy rather than installing alongside it.

            Requires macOS 14.4 (Sonoma) or later -- the per-app volume backend depends on a
            Core Audio API not available on older versions. See src-tauri/macos-audio/README.md
            for the full architecture and what's still unverified.
          releaseDraft: true
          prerelease: true
          args: --target universal-apple-darwin
