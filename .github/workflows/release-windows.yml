name: Release Windows

# Tag-triggered Windows release: push a `vX.Y.Z` tag (or `vX.Y.Z-beta.N` for a prerelease) and
# this builds an NSIS installer and attaches it to a GitHub Release matching the tag -- shared
# with release-macos.yml, which builds the same tag in parallel and attaches its own installer to
# that same release. release-linux.yml is separate and manual-only (see its own doc comment).
#
# Unsigned: users will see a SmartScreen "Windows protected your PC" warning until the binary
# earns enough download reputation, or until we buy an EV code-signing cert / ship through the
# Microsoft Store -- both deferred until there's real user traffic.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Point the updater at the beta manifest, for a prerelease tag
        if: contains(github.ref_name, '-')
        shell: bash
        run: |
          # See release-macos.yml's identical step for the full rationale.
          jq '.plugins.updater.endpoints = ["https://github.com/${{ github.repository }}/releases/download/latest-beta/latest-beta.json"]' \
            src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the NSIS updater artifact (MiXolume_*_x64-setup.exe.sig) so
          # tauri-plugin-updater can verify it -- unrelated to, and not a substitute for, real
          # Windows code signing (still absent, see the file header).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MiXolume ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what's new.

            **macOS:** signed and notarized by Apple -- just open it like any other app.
            Requires macOS 14.4+.

            **Windows:** unsigned -- SmartScreen may warn on first run. Click **More info → Run
            anyway**.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Update the auto-update manifest
        uses: ./.github/actions/generate-update-manifest
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
