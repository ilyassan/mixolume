name: Release Linux

# Manually-triggered Linux build: macOS and Windows are the only officially published platforms
# for now (see CONTRIBUTING.md), so this no longer fires automatically on every tag push --
# generate-update-manifest's own auto-update manifest only ever waits on Windows+macOS signatures,
# and this workflow firing unattended alongside them would either race it (attaching a third,
# untested installer to a release before anyone's actually verified Linux still works) or leave a
# permanently-unsatisfiable "waiting on a Linux signature that will never arrive" failure mode.
# Run it by hand (Actions tab -> Release Linux -> Run workflow, tag name as the tag to build for)
# when Linux support is ready to ship again.
#
# Unsigned by convention -- Linux packages aren't part of an OS-level trust chain the way
# macOS/Windows are.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to build and attach the Linux installers to
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the AppImage updater artifact (MiXolume_*.AppImage.sig) so
          # tauri-plugin-updater can verify it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "MiXolume ${{ inputs.tag }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what's new.

            **Linux:** unsigned, community-maintained build -- not one of the officially published
            platforms yet. No auto-update on this platform.
          releaseDraft: true
          prerelease: ${{ contains(inputs.tag, '-') }}
