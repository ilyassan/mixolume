name: Release Linux

# Tag-triggered Linux release: push a `vX.Y.Z` tag (or `vX.Y.Z-beta.N` for a prerelease) and this
# builds an AppImage and a .deb and attaches them to a GitHub Release matching the tag -- shared
# with release-macos.yml and release-windows.yml, which build the same tag in parallel and attach
# their own installers to that same release.
#
# Unsigned by convention -- Linux packages aren't part of an OS-level trust chain the way
# macOS/Windows are.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MiXolume ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what's new.

            **macOS:** signed but not yet notarized (Apple Developer Program enrollment pending)
            -- Gatekeeper will call it "unidentified developer" on first launch. Right-click the
            app and choose **Open**, or run `xattr -d com.apple.quarantine /path/to/MiXolume.app`.
            Requires macOS 14.4+.

            **Windows:** unsigned -- SmartScreen may warn on first run. Click **More info → Run
            anyway**.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
