[package]
name = "mixolume"
version = "0.1.0-beta.4"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mixolume_lib"
# `cdylib` (needed for Tauri mobile targets) is deliberately omitted: this project targets
# desktop only (see PLAN.md), and on this machine's GNU/mingw Rust host the huge symbol table
# windows-rs + tauri pull in overflows mingw ld's export-ordinal table ("export ordinal too
# large") when building the cdylib. `staticlib`/`rlib` don't hit this since they don't emit a
# DLL export table. If mobile support is ever added, re-add "cdylib" and build with the MSVC
# toolchain instead of GNU on Windows.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for tauri.conf.json's window "transparent":true to actually take
# effect on macOS -- without it, wry's own "transparent" Cargo feature (which disables WKWebView's
# `drawsBackground` and sets `NSWindow.isOpaque = false`) never compiles in, so the window keeps
# an opaque white backing underneath. Confirmed by reading tauri-runtime-wry 2.11.4's own
# Cargo.toml directly: `wry/transparent` is only pulled in via this feature (bundled with
# `wry/fullscreen`), not by tauri.conf.json's "transparent" value alone. Diagnosed after CSS-level
# rounded corners looked right everywhere except the corner cutouts, which sampled as fully opaque
# white (alpha=255) rather than transparent -- exactly what a missing `drawsBackground` override
# would produce. Also requires "macOSPrivateApi": true in tauri.conf.json's `app` config.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
thiserror = "1"
log = "0.4"
# `log`'s macros (`log::warn!` etc., used throughout this crate, including auto-duck's capture
# failure diagnostics) are no-ops without a subscriber -- nothing in this crate ever initialized
# one before, so every warning/info log this app has ever emitted went nowhere, visible neither in
# a terminal nor anywhere else. `env_logger::init()` in `run()` fixes that for `npm run tauri dev`
# (prints to the terminal it's running in); controlled via `RUST_LOG` (defaults to showing
# warn+error if unset -- see the `init()` call site for the exact default).
env_logger = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    # `implement`: needed for the `windows::core::implement!` macro, which
    # `windows_ducking.rs` uses to provide a COM `IActivateAudioInterfaceCompletionHandler` for
    # Process Loopback Capture's async activation.
    "implement",
] }
# Real speech/music discrimination for auto-duck (src/mixer/duck_detect.rs, shared with macOS) --
# see that file's and Cargo.toml's macOS-dependency-block comment for the full rationale (wraps
# libfvad, the real WebRTC project's VAD, instead of a from-scratch classifier that was confirmed
# live to misclassify music as speech almost continuously).
webrtc-vad = "0.4"
# Needed alongside `windows`'s own `implement` feature: the `#[implement(...)]` macro
# (windows_ducking.rs's `IActivateAudioInterfaceCompletionHandler`) expands to code that
# references the `windows_core` crate directly, not only through `windows::core`'s re-export --
# confirmed by the build failing with "could not find `windows_core` in the list of imported
# crates" until this was added as its own direct dependency.
windows-core = "0.58"

[target.'cfg(target_os = "linux")'.dependencies]
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Core Audio Process Tap API backend (see src-tauri/src/mixer/macos.rs's module doc comment and
# src-tauri/macos-audio/README.md for the full rationale). CATapDescription and the
# AudioHardwareCreateProcessTap/AudioHardwareCreateAggregateDevice/AudioDeviceCreateIOProcIDWithBlock
# functions were confirmed (via docs.rs, 2026-08-20) to live in `objc2-core-audio`, NOT
# `objc2-audio-toolbox` as originally assumed -- so `objc2-audio-toolbox` is deliberately not a
# dependency here. Exact versions below were the `max_stable_version` crates.io reported for each
# crate at research time; re-check before bumping since this whole file is unverified/uncompiled.
objc2 = "0.6"
# NSNumber has no feature of its own -- it's defined inside the `NSValue` feature's generated
# module (confirmed by downloading objc2-foundation 0.3.2's source and checking
# src/generated/NSValue.rs directly, after `cargo check` on Windows caught this: Cargo resolves
# the full dependency graph including other-OS target deps even when not building for that OS, so
# a bad macOS-only feature name broke resolution here too).
# NSProcessInfo added for disableAutomaticTermination -- without it, macOS's Automatic
# Termination silently kills this app (confirmed live via Console logs: "AutomaticTermination:
# No windows open yet" followed minutes later by a clean voluntary exit, code 0, no crash) since
# it's an accessory-policy menu-bar app that deliberately keeps its window hidden between tray
# clicks, which macOS reads as "idle background app, safe to reap".
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSValue", "NSObject", "NSProcessInfo"] }
objc2-core-audio = { version = "0.3", features = ["AudioHardware"] }
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"
# For resolving a tapped process's real display name (e.g. "YTAudioBar" instead of the raw
# "com.ytaudiobar.app" bundle id) via NSRunningApplication.localizedName -- confirmed present in
# objc2-app-kit 0.3.2's generated bindings (src/generated/NSRunningApplication.rs).
# `runningApplicationWithProcessIdentifier` is itself gated behind objc2-app-kit's own `libc`
# feature (confirmed by reading that file's `#[cfg(feature = "libc")]` directly), separate from
# just depending on the `libc` crate ourselves for the `libc::pid_t` parameter type.
#
# NSImage/NSBitmapImageRep added for icon resolution: NSRunningApplication.icon() -> NSImage ->
# TIFFRepresentation() -> NSBitmapImageRep -> representationUsingType_properties(.PNG) -> PNG
# bytes. Confirmed each step's real signature by reading the generated bindings directly rather
# than assuming (e.g. it's `TIFFRepresentation`, all-caps TIFF, not `tiffRepresentation`).
objc2-app-kit = { version = "0.3", features = [
    "NSRunningApplication",
    "libc",
    "NSImage",
    "NSBitmapImageRep",
    # NSWorkspace.sharedWorkspace().runningApplications() -- lists every currently-running app
    # (filtered to NSApplicationActivationPolicy::Regular, i.e. normal dock-visible apps), for
    # the auto-duck "add app" picker. Deliberately not scanning /Applications for *installed*
    # apps that aren't currently running -- that needs Launch Services / bundle-icon resolution
    # this project doesn't otherwise touch, for a case (add an app before it's ever been opened)
    # that's a much rarer real need than "it's open right now but hasn't made sound yet".
    "NSWorkspace",
] }
libc = "0.2"
# For walking up a process's parent chain when resolving app names -- some audio-producing
# processes (e.g. Chromium/Brave's ".helper" renderer subprocesses) have no usable
# NSRunningApplication.localizedName of their own, but their parent (the actual browser process)
# does. `pidinfo::<bsd_info::BSDInfo>` wraps `proc_pidinfo(PROC_PIDTBSDINFO)`, whose
# `proc_bsdinfo.pbi_ppid` field is the parent pid -- confirmed via the crate's own generated
# bindings (docs_rs/osx_libproc_bindings.rs) since `libc` itself doesn't expose Darwin's private
# `kinfo_proc` layout.
libproc = "0.14"
# Real speech/music discrimination for the auto-duck feature (src/mixer/macos_ducking.rs),
# replacing an earlier hand-rolled energy+zero-crossing-rate heuristic that -- confirmed live,
# not assumed -- classified ordinary music as speech almost continuously. This wraps libfvad,
# the actual WebRTC project's Voice-Activity-Detection module (a classic Gaussian Mixture Model,
# not a neural net): the same code literally every WebRTC video call uses to decide when someone
# is talking, vendored as C source and compiled by `cc` at build time -- no bundled ML runtime,
# no model file, no new heavyweight dependency. Requires a C compiler (already needed for this
# project's Xcode/Tauri toolchain) but no external system library. `is_voice_segment` requires
# audio in exact 10/20/30ms i16 chunks at a fixed sample rate -- see `macos_ducking.rs`'s frame
# accumulator for why that doesn't just line up with Core Audio's own callback size.
webrtc-vad = "0.4"

[dev-dependencies]
tokio-test = "0.4"

# This is a small menu-bar utility that should be light to download and install, so stripping
# debug symbols from the shipped binary is a clear win with zero behavioral risk (they're not
# useful in a release build without a matching source tree anyway).
#
# Deliberately NOT using opt-level="s"/lto=true/codegen-units=1/panic="abort" here: tried them
# once (2026-08-22) and audio session detection broke live on real hardware immediately after --
# reverted without fully root-causing it, but this codebase's macOS backend (macos.rs) is heavy
# with unsafe FFI directly against Core Audio (CATapDescription, AudioHardwareCreateProcessTap,
# raw IOProc callbacks via block2), which is exactly the kind of code where aggressive
# cross-crate optimization can surface latent unsafe-code bugs that happen to not manifest under
# normal compilation. Not worth the risk for a binary that's already ~3MB before any of this.
[profile.release]
strip = true

