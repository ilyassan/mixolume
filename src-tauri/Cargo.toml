[package]
name = "mixolume"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mixolume_lib"
# `cdylib` (needed for Tauri mobile targets) is deliberately omitted: this project targets
# desktop only (see PLAN.md), and on this machine's GNU/mingw Rust host the huge symbol table
# windows-rs + tauri pull in overflows mingw ld's export-ordinal table ("export ordinal too
# large") when building the cdylib. `staticlib`/`rlib` don't hit this since they don't emit a
# DLL export table. If mobile support is ever added, re-add "cdylib" and build with the MSVC
# toolchain instead of GNU on Windows.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
thiserror = "1"
log = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
] }

[target.'cfg(target_os = "linux")'.dependencies]
regex = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# Core Audio Process Tap API backend (see src-tauri/src/mixer/macos.rs's module doc comment and
# src-tauri/macos-audio/README.md for the full rationale). CATapDescription and the
# AudioHardwareCreateProcessTap/AudioHardwareCreateAggregateDevice/AudioDeviceCreateIOProcIDWithBlock
# functions were confirmed (via docs.rs, 2026-08-20) to live in `objc2-core-audio`, NOT
# `objc2-audio-toolbox` as originally assumed -- so `objc2-audio-toolbox` is deliberately not a
# dependency here. Exact versions below were the `max_stable_version` crates.io reported for each
# crate at research time; re-check before bumping since this whole file is unverified/uncompiled.
objc2 = "0.6"
# NSNumber has no feature of its own -- it's defined inside the `NSValue` feature's generated
# module (confirmed by downloading objc2-foundation 0.3.2's source and checking
# src/generated/NSValue.rs directly, after `cargo check` on Windows caught this: Cargo resolves
# the full dependency graph including other-OS target deps even when not building for that OS, so
# a bad macOS-only feature name broke resolution here too).
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSValue", "NSObject"] }
objc2-core-audio = { version = "0.3", features = ["AudioHardware"] }
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"
# For resolving a tapped process's real display name (e.g. "YTAudioBar" instead of the raw
# "com.ytaudiobar.app" bundle id) via NSRunningApplication.localizedName -- confirmed present in
# objc2-app-kit 0.3.2's generated bindings (src/generated/NSRunningApplication.rs).
# `runningApplicationWithProcessIdentifier` is itself gated behind objc2-app-kit's own `libc`
# feature (confirmed by reading that file's `#[cfg(feature = "libc")]` directly), separate from
# just depending on the `libc` crate ourselves for the `libc::pid_t` parameter type.
#
# NSImage/NSBitmapImageRep added for icon resolution: NSRunningApplication.icon() -> NSImage ->
# TIFFRepresentation() -> NSBitmapImageRep -> representationUsingType_properties(.PNG) -> PNG
# bytes. Confirmed each step's real signature by reading the generated bindings directly rather
# than assuming (e.g. it's `TIFFRepresentation`, all-caps TIFF, not `tiffRepresentation`).
objc2-app-kit = { version = "0.3", features = [
    "NSRunningApplication",
    "libc",
    "NSImage",
    "NSBitmapImageRep",
] }
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"

